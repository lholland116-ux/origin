apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def requiredReleaseSigningProperties = ["storeFile", "storePassword", "keyAlias", "keyPassword"]

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def missingReleaseSigningProperties = requiredReleaseSigningProperties.findAll {
    !keystoreProperties.getProperty(it)?.trim()
}
def configuredReleaseStoreFile = missingReleaseSigningProperties.isEmpty()
    ? file(keystoreProperties.getProperty("storeFile"))
    : null
def releaseSigningConfigured = keystorePropertiesFile.exists() &&
    missingReleaseSigningProperties.isEmpty() && configuredReleaseStoreFile.isFile()

android {
    namespace = "com.lvtchat.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.lvtchat.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 11
        versionName "1.0.11"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                // file() supports both module-relative and absolute paths.
                storeFile configuredReleaseStoreFile
                storePassword keystoreProperties.getProperty("storePassword")
                keyAlias keystoreProperties.getProperty("keyAlias")
                keyPassword keystoreProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def releaseBundleRequested = taskGraph.allTasks.any {
        it.path == ":app:packageRelease" || it.path == ":app:bundleRelease"
    }
    if (releaseBundleRequested && !releaseSigningConfigured) {
        def detail
        if (!keystorePropertiesFile.exists()) {
            detail = "missing android/keystore.properties"
        } else if (!missingReleaseSigningProperties.isEmpty()) {
            detail = "missing or blank properties: ${missingReleaseSigningProperties.join(', ')}"
        } else {
            detail = "the configured storeFile does not exist or is not a file"
        }
        throw new GradleException(
            "Release signing is not configured (${detail}). " +
            "Copy android/keystore.properties.example to android/keystore.properties and provide all required values."
        )
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
